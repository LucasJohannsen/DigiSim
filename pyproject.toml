[project]
name = "digisim"
version = "0.1.0"
description = "A digital simulation project using SimPy"
authors = [
    
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "simpy>=4.0.1",
    "numpy>=1.23.0",
    "geopandas>=0.10.0",
    "netCDF4>=1.5.0",
    "python-dotenv>=0.19.0",
    "requests>=2.26.0",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "tenacity>=8.2",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["models*", "services*", "scheduler*", "utils*"]
exclude = ["config*", "export*", "tests*", "documentation*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "pyyaml>=6.0",
    "respx>=0.21",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "documentation/playground",
    "export",
    "poc",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length handled by formatter
    "SIM102", # nested if – style preference, not a bug
    "SIM108", # ternary instead of if-else – readability preference
    "SIM114", # combine if branches – readability preference
    "SIM117", # nested with – style preference
    "SIM105", # contextlib.suppress – style preference
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "documentation/",
    "export/",
    "poc/",
    "tests/",
]
