services:
  digisim:
    build: .
    container_name: digisim
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./state:/app/state
      - ./retry_queue:/app/retry_queue
      - ./logs:/app/logs
      - ./config:/app/config:ro
    environment:
      - STATE_DIR=/app/state
      - LOG_FILE=/app/logs/digisim.log
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 60s      # Check every minute for faster failure detection
      timeout: 10s       # Allow 10s for healthcheck script to complete
      retries: 3         # Mark unhealthy after 3 consecutive failures
      start_period: 2m   # Allow 2 minutes for initial startup
